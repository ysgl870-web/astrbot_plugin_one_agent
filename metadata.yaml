name: astrbot_plugin_one_agent
display_name: 待办事项与提醒
desc: 实用的待办事项、提醒、图片菜单与管理员控制插件，支持群聊/私聊会话隔离、永久 ID、定时提醒和管理员权限控制。
short_desc: 待办 + 定时提醒 + 图片菜单 + 管理员控制
help: |
  常用指令：
  - 待办 <内容> [高/中/低]：添加待办
  - 待办列表：查看列表
  - 完成 <序号>：完成当前列表中的第 N 项
  - 完成 #12：按永久 ID 精确完成
  - 删除 <序号>：删除待办
  - 今日待办：查看今天的任务
  - 完成率：查看统计
  - 提醒 <编号> <时间>：设置提醒，如“提醒 1 18:30”
  - 取消提醒 <编号>：取消提醒
  - 代办菜单：显示文字/图片菜单（可在配置中选择）
  - 管理面板：管理员专用
  - 管理设置：管理员专用
version: 2.2.0
author: ysgl
repo: https://github.com/ysgl870-web/astrbot_plugin_one_agent
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - discord
  - kook
astrbot_version: ">=4.16,<5"
