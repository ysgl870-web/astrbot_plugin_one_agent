name: astrbot_plugin_one_agent
display_name: 待办事项与提醒 Pro
desc: 待办、提醒、截止时间、搜索统计、签到积分、小游戏以及 QQ Official Markdown/Ark/Keyboard 多消息样式的综合插件。
short_desc: 待办 + 智能提醒 + QQ 多消息样式 + 小游戏
help: |
  常用指令：
  - 待办 <内容> [高/中/低]
  - 待办列表
  - 完成 <编号> / 完成 #12
  - 删除 <编号>
  - 编辑 <编号> <新内容>
  - 提醒 <编号> <时间>
  - 取消提醒 <编号>
  - 截止 <编号> <时间>
  - 今日待办 / 逾期待办 / 搜索 <关键词> / 待办统计
  - 代办菜单
  - 小游戏 / 猜数字 / 石头剪刀布 / 掷骰子 / 猜硬币 / 幸运抽签
  - 签到 / 积分榜
  - 管理面板 / 管理设置（管理员）
version: 3.0.0
author: ysgl
repo: https://github.com/ysgl870-web/astrbot_plugin_one_agent
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - discord
  - kook
  - wecom
  - lark
astrbot_version: ">=4.16,<5"
